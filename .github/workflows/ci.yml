name: Build and test
on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p meshclip-core --all-targets --locked -- -D warnings
      - run: cargo test -p meshclip-core --locked
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: cargo clippy -p meshclip-desktop --locked -- -D warnings
      - run: npm run tauri build -- --bundles nsis
        working-directory: apps/desktop
      - name: Smoke-start native Windows desktop
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/release/meshclip-desktop.exe").Path
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput desktop.stdout.log -RedirectStandardError desktop.stderr.log
          $ready = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Desktop exited before startup: $($process.ExitCode)" }
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                $connect = $client.ConnectAsync("127.0.0.1", 47831)
                if ($connect.Wait(500) -and $client.Connected) { $ready = $true; break }
              } catch { } finally { $client.Dispose() }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Desktop application listener did not become ready" }
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw "Desktop exited after listener startup" }
            Write-Output "Native desktop stayed alive with application listener on 127.0.0.1:47831"
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-Content desktop.stdout.log, desktop.stderr.log -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: meshclip-windows-x64-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
