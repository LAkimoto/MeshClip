name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p meshclip-core --all-targets --locked -- -D warnings
      - run: cargo test -p meshclip-core --locked
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: cargo clippy -p meshclip-desktop --locked -- -D warnings
      - run: npm run tauri build -- --bundles nsis
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: meshclip-windows-x64-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
